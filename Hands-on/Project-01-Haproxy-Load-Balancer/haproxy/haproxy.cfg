# ---------------------------------------------------------
# Global settings — apply to the HAProxy process as a whole
# ---------------------------------------------------------
global
    log stdout format raw local0   # send logs to stdout so `docker logs` captures them
    maxconn 4096                   # max simultaneous connections HAProxy will accept

# ---------------------------------------------------------
# Defaults — inherited by every frontend/backend below
# ---------------------------------------------------------
defaults
    log     global
    mode    http                   # operate at the HTTP layer (not raw TCP)
    option  httplog                # log HTTP-specific details (status code, path, etc.)
    timeout connect 5s             # max time to establish a connection to a backend
    timeout client  30s            # max time to wait on the client side
    timeout server  30s            # max time to wait on the backend side

# ---------------------------------------------------------
# Frontend — what HAProxy exposes to the outside world
# ---------------------------------------------------------
frontend http_front
    bind *:80                      # listen on port 80 inside the container
    default_backend web_servers    # send all traffic to the backend pool below

# ---------------------------------------------------------
# Backend — the pool of real servers HAProxy load-balances across
# ---------------------------------------------------------
backend web_servers
    balance roundrobin              # rotate requests evenly across servers
    option httpchk GET /health      # actively poll /health on each server
    http-check expect status 200    # only consider a server healthy on HTTP 200

    # Docker Compose's internal DNS resolves these hostnames to the
    # right container IPs automatically — no manual IP management needed.
    server web1 web1:5000 check
    server web2 web2:5000 check
    server web3 web3:5000 check
